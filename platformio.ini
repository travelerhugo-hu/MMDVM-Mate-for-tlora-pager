; ============================================================================
;  MMDVM Mate  -  BrandMeister Hoseline monitor firmware
;  Target : LilyGo T-LoRa-Pager (ESP32-S3, 16MB flash / 8MB PSRAM, 480x222)
;
;  Platform note:
;  LilyGoLib really does need Arduino-ESP32 core >= 3.3.0 (ESP-IDF 5.x). The
;  `#error` in LilyGoLib.h is suppressed when PLATFORMIO is defined, but that
;  only hides the message - the code itself does not compile on the 2.0.17 core
;  that platformio/espressif32 6.x ships:
;
;    LilyGoDispInterface.cpp:449: 'esp_lcd_panel_dev_config_t' has no member
;    named 'rgb_ele_order'      <- IDF 5 field, guarded by an ESP_ARDUINO_VERSION
;                                  test that is true for every 3.x/2.x core
;
;  The vendor's own PlatformIO template still pins espressif32@6.10.0 and is
;  therefore stale. pioarduino is the community platform that packages current
;  Arduino cores; 55.03.311 == Arduino 3.3.11 / ESP-IDF 5.5.5.
; ============================================================================

[platformio]
boards_dir    = ./boards
default_envs  = tlora_pager

[env:tlora_pager]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board     = lilygo-t-lora-pager

upload_speed    = 921600
monitor_speed   = 115200
monitor_filters = default, esp32_exception_decoder

board_build.filesystem  = fatfs
board_build.partitions  = partitions.csv

; No -std override: Arduino core 3.x builds at gnu++2b and several IDF 5
; headers rely on it. Nothing in MMDVM Mate needs a specific dialect.

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_T_LORA_PAGER
    -I variants/lilygo_tlora_pager

    ; --- LVGL configuration --------------------------------------------------
    ; PlatformIO does not put the project include/ directory on the search path
    ; used when compiling *library* sources, so lvgl's __has_include("lv_conf.h")
    ; probe misses ours and it falls back to "../../lv_conf.h" (i.e. next to the
    ; lvgl folder), which does not exist. Worse, LilyGoLib ships its own
    ; src/lv_conf.h, so anything relying on include-path ordering would be a
    ; coin flip. An absolute LV_CONF_PATH removes both problems - lvgl
    ; stringifies this macro itself, so it must NOT be quoted here.
    -D LV_CONF_PATH=${platformio.include_dir}/lv_conf.h

    ; --- PSRAM: LVGL draw buffers and the audio jitter buffer live here ------
    -D BOARD_HAS_PSRAM

    ; --- LoRa radio variant fitted on the board (required by LilyGoLib) -----
    -D ARDUINO_LILYGO_LORA_SX1262

    ; --- RadioLib: strip everything we do not use, saves a lot of flash -----
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_SX1231
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX127X
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV
    -D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_BELL

    -Wnarrowing
    -Wno-unused-variable
    -Wno-missing-field-initializers

; ---------------------------------------------------------------------------
;  Dependencies
;
;  LilyGoLib/library.json HARD-PINS lvgl 9.2.2, RadioLib 7.1.2, XPowersLib
;  0.2.9 and SensorLib 0.3.1. Listing those again here with a "^" range makes
;  PlatformIO install a *second* copy into e.g. libdeps/lvgl@9.2.2, and the LDF
;  then feeds both to the compiler. So they are deliberately NOT repeated - the
;  transitive pins are authoritative.
;
;  Only libraries LilyGoLib needs but does not declare (keyboard, GPS, NFC) and
;  the one library that is genuinely ours (WebSockets) are listed.
; ---------------------------------------------------------------------------
lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGoLib
    mikalhart/TinyGPSPlus @ ^1.0.3
    adafruit/Adafruit TCA8418 @ ^1.0.2
    adafruit/Adafruit BusIO @ ^1.17.0
    https://github.com/lewisxhe/ST25R3916-fork.git
    https://github.com/lewisxhe/NFC-RFAL-fork.git
    links2004/WebSockets @ ^2.6.1

; The BLE/audio/IR extras the vendor factory demo pulls in are deliberately
; NOT listed: MMDVM Mate never touches them and they cost ~400 kB of flash.
; "deep", not "deep+": the "+" variants evaluate preprocessor conditionals, and
; LilyGoKeyboard.cpp guards its #include <Adafruit_TCA8418.h> behind
; USING_INPUT_DEV_KEYBOARD, which is defined in the board variant header that
; the LDF never parses. The result is a dependency the LDF cannot see and a
; "No such file or directory" at compile time.
lib_ldf_mode = deep
