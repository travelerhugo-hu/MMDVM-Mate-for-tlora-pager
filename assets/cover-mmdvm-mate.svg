<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0E1633"/>
    <stop offset="1" stop-color="#0E3A3F"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1536" height="1024" fill="url(#bg)"/>

<!-- globe motif (right) -->
<g stroke="#58A6FF" fill="none" stroke-opacity="0.30" stroke-width="1.5">
  <circle cx="1200" cy="560" r="150"/>
  <ellipse cx="1200" cy="560" rx="60" ry="150"/>
  <ellipse cx="1200" cy="560" rx="110" ry="150"/>
  <line x1="1050" y1="560" x2="1350" y2="560"/>
  <line x1="1057" y1="480" x2="1343" y2="480"/>
  <line x1="1057" y1="640" x2="1343" y2="640"/>
</g>
<g fill="#58A6FF" fill-opacity="0.5">
  <circle cx="1150" cy="500" r="3"/>
  <circle cx="1260" cy="600" r="3"/>
  <circle cx="1210" cy="520" r="2.5"/>
</g>

<!-- radio waves from device to globe -->
<g stroke="#58A6FF" fill="none" stroke-opacity="0.18" stroke-width="2">
  <path d="M1000 560 A150 150 0 0 1 1180 470"/>
  <path d="M1000 560 A230 230 0 0 1 1240 400"/>
  <path d="M1000 560 A310 310 0 0 1 1270 350"/>
</g>

<!-- device body + screen -->
<rect x="240" y="394" width="760" height="373" rx="30" fill="#0B0E14" stroke="#30363D" stroke-width="2"/>
<g transform="translate(260,414) scale(1.5)">
<rect x="0" y="0" width="480" height="222" fill="#0D1117"/>

<!-- top banner -->
<rect x="0" y="0" width="480" height="30" fill="#161B22"/>
<g transform="translate(10,7)" stroke="#3FB950" stroke-width="2" fill="none" stroke-linecap="round">
  <path d="M5 11 A11 11 0 0 1 27 11"/>
  <path d="M9 15 A7 7 0 0 1 23 15"/>
  <circle cx="16" cy="19" r="1.8" fill="#3FB950" stroke="none"/>
</g>
<text x="34" y="20" font-family="Arial" font-size="14" fill="#3FB950">HOSELINE</text>
<text x="240" y="20" text-anchor="middle" font-family="Arial" font-size="16" fill="#C9D1D9">12:34:56 UTC</text>
<g transform="translate(436,9)">
  <rect x="0" y="0" width="16" height="13" rx="2" fill="none" stroke="#C9D1D9" stroke-width="1.5"/>
  <rect x="16.2" y="3.5" width="2.6" height="6" fill="#C9D1D9"/>
  <rect x="2" y="2" width="11" height="9" fill="#C9D1D9"/>
</g>
<text x="432" y="20" text-anchor="end" font-family="Arial" font-size="14" fill="#C9D1D9">82%</text>

<!-- call panel -->
<text x="10" y="52" font-family="Arial" font-size="20" fill="#58A6FF">TG 2624</text>
<rect x="320" y="40" width="150" height="8" rx="2" fill="#1C2129"/>
<rect x="320" y="40" width="95" height="8" rx="2" fill="#3FB950"/>
<text x="240" y="86" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="40" fill="#3FB950">DL1ABC</text>
<text x="240" y="112" text-anchor="middle" font-family="Arial" font-size="14" fill="#C9D1D9">Hans Müller</text>

<!-- history panel -->
<rect x="0" y="120" width="480" height="76" fill="#161B22"/>
<line x1="0" y1="120" x2="480" y2="120" stroke="#30363D" stroke-width="1"/>
<text x="10" y="135" font-family="Arial" font-size="14" fill="#3FB950">DL1ABC</text>
<text x="470" y="135" text-anchor="end" font-family="Arial" font-size="14" fill="#6E7681">TG 2624  12:31</text>
<text x="10" y="153" font-family="Arial" font-size="14" fill="#C9D1D9">OE3DEF</text>
<text x="470" y="153" text-anchor="end" font-family="Arial" font-size="14" fill="#6E7681">TG 2624  12:28</text>
<text x="10" y="171" font-family="Arial" font-size="14" fill="#C9D1D9">F4GHB</text>
<text x="470" y="171" text-anchor="end" font-family="Arial" font-size="14" fill="#6E7681">TG 2624  12:21</text>
<text x="10" y="189" font-family="Arial" font-size="14" fill="#C9D1D9">GM1XYZ</text>
<text x="470" y="189" text-anchor="end" font-family="Arial" font-size="14" fill="#6E7681">TG 2624  12:15</text>

<!-- bottom banner -->
<rect x="0" y="196" width="480" height="26" fill="#1C2129"/>
<text x="8" y="213" font-family="Arial" font-size="12" fill="#6E7681">S settings   L backlight   Q/E volume</text>
<g transform="translate(426,205)">
  <path d="M0 1 L4 1 L9 -4 L9 13 L4 8 L0 8 Z" fill="#C9D1D9"/>
  <path d="M12 1 A5 5 0 0 1 12 11" stroke="#C9D1D9" stroke-width="1.4" fill="none"/>
  <path d="M15 4 A2.6 2.6 0 0 1 15 8" stroke="#C9D1D9" stroke-width="1.4" fill="none"/>
</g>
<text x="470" y="213" text-anchor="end" font-family="Arial" font-size="12" fill="#C9D1D9">80%</text>
</g>

<!-- wordmark -->
<text x="768" y="150" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="64" fill="#FFFFFF">MMDVM Mate</text>
<text x="768" y="200" text-anchor="middle" font-family="Arial" font-size="26" fill="#C9D1D9">Listen to the world's talkgroups</text>
</svg>